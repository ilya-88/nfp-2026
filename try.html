<script>globalThis.NFP_DATA=[{"id":1,"name":"Сгибание и разгибание рук в упоре лежа","text":["Упор лежа (руки и тело прямые, ноги вместе), согнуть руки до касания грудью пола (или технического приспособления высотой не более 5 см), разгибая руки, принять упор лежа.","Положение упора лежа фиксировать не менее 1 секунды (продолжить движение после объявления счета).","Разводить ноги, сгибание тела и ног, отдых в положении упора лежа на согнутых руках не допускается.","Упражнение выполняется в спортивной форме одежды по команде \"К выполнению упражнения ПРИСТУПИТЬ\".","При нарушении условий выполнения упражнения повторение не засчитывается, подается команда \"НЕ СЧИТАТЬ\"."],"group":"Сила","special":false,"kind":"count","unit":"количество","variant":"none","points":[[[50.0,100],[49.0,98],[48.0,96],[47.0,94],[46.0,92],[45.0,90],[44.0,88],[43.0,86],[42.0,84],[41.0,82],[40.0,80],[39.0,78],[38.0,76],[37.0,74],[36.0,72],[35.0,70],[34.0,68],[33.0,66],[32.0,64],[31.0,62],[30.0,60],[29.0,58],[28.0,56],[27.0,54],[26.0,52],[25.0,50],[24.0,48],[23.0,46],[22.0,44],[21.0,42],[20.0,40],[19.0,38],[18.0,36],[17.0,34],[16.0,32],[15.0,30],[14.0,27],[13.0,24],[12.0,22],[11.0,20],[10.0,18],[9.0,16],[8.0,14],[7.0,12],[6.0,10],[5.0,8],[4.0,6],[3.0,4],[2.0,2],[1.0,1]]],"higher":true},{"id":2,"name":"Наклон туловища вперед","text":["Лежа на спине с согнутыми ногами (руки за голову, пальцы в \"замок\", ноги согнуты, ступни прижаты к полу, лопатки касаются пола), наклонить туловище вперед до касания локтями коленей и возвратиться в положение лежа на спине с согнутыми ногами (продолжить движение после объявления счета).","Упражнение выполняется в течение одной минуты.","Разрешается фиксировать ноги за голеностопы руками партнера.","Отрыв ступней от опорной поверхности (пола) не допускается.","Упражнение выполняется в спортивной форме одежды по команде \"К выполнению упражнения ПРИСТУПИТЬ\".","При нарушении условий выполнения упражнения повторение не засчитывается, подается команда \"НЕ СЧИТАТЬ\". ],[86.0,6],[85.0,5],[84.0,4],[83.0,3],[82.0,2],[81.0,1]]],"higher":true},{"id":32,"name":"Передвижение по узкой опоре (бревну)","text":["Стоя на бревне перед линией, выполнить передвижение лицом вперед, обратно спиной вперед, затем левым (правым) боком и обратно правым (левым) боком; завершить выполнение упражнения пересечением линии с остановкой на краю бревна.","При передвижении по бревну обязательно пересечь или наступить ногой на линии с обеих сторон.","Опираться руками на бревно при передвижении не допускается.","При нарушении условий выполнения упражнения, выполнение не засчитывается.","Высота бревна 110 - 125 см; длина 500 см; ширина 10 см. В 50 см от края бревна с обеих сторон отмечаются линии шириной 10 см.","Упражнение выполняется в спортивной форме одежды по команде \"ВПЕРЕД\".","В случае падения со снаряда предоставляется вторая попытка для выполнения упражнения.","(абзац введен Приказом Министра обороны РФ от 14.03.2025 N 146)"],"group":"Ловкость","special":false,"kind":"seconds","unit":"секунды","variant":"none","points":[[[11.0,100],[11.5,96],[12.0,92],[12.5,88],[13.0,84],[13.5,80],[14.0,76],[14.5,72],[15.0,68],[15.5,64],[16.0,60],[16.5,54],[17.0,50],[17.5,44],[18.0,38],[18.5,32],[19.0,28],[19.5,24],[20.0,20],[20.5,16],[21.0,12],[21.5,8],[22.0,5],[22.5,3],[23.0,1]]],"higher":false},{"id":33,"name":"Комбинированное упражнение на брусьях","text":["Упражнение предназначено для курсантов образовательных организаций.","Вариант N 1: Упор на руках на брусьях, размахивание, подъем махом вперед в сед ноги врозь, перемах ног внутрь и мах назад, махом вперед соскок вправо с поворотом налево, держась за жердь двумя руками.","Вариант N 2: Упор на руках на брусьях, размахивание, подъем махом вперед, мах назад, махом вперед соскок вправо с поворотом налево, держась за жердь двумя руками.","Вариант N 3: Упор на руках на брусьях, размахивание, подъем махом вперед, мах назад, махом вперед сед ноги врозь, перехват рук вперед, силой стойка на плечах (держать 2 с), кувырок вперед в сед ноги врозь, перемах ног внутрь и мах назад, махом вперед соскок вправо с поворотом налево, держась за жердь двумя руками.","Добавление, пропуск элементов упражнения, нарушение техники выполнения упражнения не допускаются.","Упражнение выполняется в спортивной форме одежде по команде \"К СНАРЯДУ\"."],"group":"Ловкость","special":false,"kind":"choice","unit":"Зачтённый результат","variant":"none","points":[[[3,100],[2,70],[1,40]]],"higher":true,"choices":["Не выполнено","Вариант 1","Вариант 2","Вариант 3"]},{"id":34,"name":"Комбинированное упражнение на перекладине","text":["Упражнение предназначено для курсантов образовательных организаций.","Вариант N 1: Вис на перекладине, подъем переворотом, мах дугой, соскок махом назад.","Вариант N 2: Вис на перекладине, размахивание, подъем разгибом, мах дугой, соскок махом назад.","Вариант N 3: Вис на перекладине, размахивание, подъем разгибом, оборот назад в упоре, мах дугой, соскок махом назад.","Добавление, пропуск элементов упражнения, нарушение техники выполнения упражнения не допускаются.","Упражнение выполняется в спортивной формы одежде по команде \"К СНАРЯДУ\"."],"group":"Ловкость","special":false,"kind":"choice","unit":"Зачтённый результат","variant":"none","points":[[[3,100],[2,70],[1,40]]],"higher":true,"choices":["Не выполнено","Вариант 1","Вариант 2","Вариант 3"]},{"id":35,"name":"Упражнения в опорных прыжках","text":["Упражнение предназначено для курсантов образовательных организаций.","Вариант N 1: Прыжок ноги врозь через козла в длину (рис. 30) .","Прыжок выполняется с разбега, толчком двумя ногами одновременно от мостика потянуться руками к опоре, поставить руки на козла, отталкиваясь развести ноги, руки вверх - в стороны, разгибаясь приземлиться на ноги.","Вариант N 2: Прыжок, согнув ноги, через коня (козла) в ширину (рис. 31) .","Прыжок выполняется с разбега, толчком двумя ногами одновременно от мостика потянуться руками к опоре, поставить руки на коня, сгибаясь, согнуть ноги, до прохождения ногами вертикали оттолкнуться руками, разгибаясь, приземлиться на ноги.","Вариант N 3: Прыжок ноги врозь через коня в длину (рис. 32) .","Прыжок выполняется с разбега, толчком двумя ногами одновременно от мостика потянуться руками к опоре, поставить руки на дальнюю половину коня, отталкиваясь, развести ноги, руки вверх - в стороны, разгибаясь, приземлиться на ноги.","Перебор руками, касание мата рукой (руками) после приземления не допускаются.","Высота гимнастического коня 120 - 130 см; гимнастический мостик устанавливается произвольно.","Упражнение выполняется в спортивной форме одежде по команде \"ВПЕРЕД\"."],"group":"Ловкость","special":false,"kind":"choice","unit":"Зачтённый результат","variant":"none","points":[[[3,100],[2,70],[1,40]]],"higher":true,"choices":["Не выполнено","Вариант 1","Вариант 2","Вариант 3"]},{"id":36,"name":"Контрольное упражнение с баскетбольным мячом","text":["Упражнение предназначено для курсантов образовательных организаций.","Выполняется в спортивной форме одежды на баскетбольной площадке (ширина 15 м, длина 28 м) с баскетбольным мячом.","По команде \"НА СТАРТ\" выйти на исходное положение на среднюю линию в центре площадки, по команде \"ВНИМАНИЕ\" взять мяч в руки. По звуковому сигналу или команде \"МАРШ\" выполнить ведение мяча в сторону баскетбольного щита, доведя мяч до линии штрафного броска, выполнить бросок мяча двумя руками от груди в щит, продолжая движение к щиту. Поймать отскочивший мяч с лета или с отскока от площадки, выполнить бросок по кольцу без ведения мяча. Поймать мяч, после заброшенного мяча в кольцо, продолжить ведение в направлении противоположного щита, с оббеганием 5 стоек, расположенных в двух метрах одна от другой, выполнить бросок по кольцу. Выполнение упражнения заканчивается после попадания мяча в кольцо.","Упражнение считается невыполненным если пропущен или не выполнен один из элементов упражнения, а также нарушено правило ведения мяча."],"group":"Ловкость","special":false,"kind":"seconds","unit":"секунды","variant":"none","points":[[[11.0,100],[11.1,99],[11.2,98],[11.3,97],[11.4,96],[11.5,95],[11.6,94],[11.7,93],[11.8,92],[11.9,91],[12.0,90],[12.1,89],[12.2,88],[12.3,87],[12.4,86],[12.5,85],[12.6,84],[12.7,83],[12.8,82],[12.9,81],[13.0,80],[13.1,79],[13.2,78],[13.3,77],[13.4,76],[13.5,75],[13.6,74],[13.7,73],[13.8,72],[13.9,71],[14.0,70],[14.1,69],[14.2,68],[14.3,67],[14.4,66],[14.5,65],[14.6,64],[14.7,63],[14.8,62],[14.9,61],[15.0,60],[15.1,59],[15.2,58],[15.3,57],[15.4,56],[15.5,55],[15.6,54],[15.7,53],[15.8,52],[15.9,51],[16.0,50],[16.1,49],[16.2,48],[16.3,47],[16.4,46],[16.5,45],[16.6,44],[16.7,43],[16.8,42],[16.9,41],[17.0,40],[17.1,39],[17.2,38],[17.3,37],[17.4,36],[17.5,35],[17.6,34],[17.7,33],[17.8,32],[17.9,31],[18.0,30],[18.1,29],[18.2,28],[18.3,27],[18.4,26],[18.5,25],[18.6,24],[18.7,23],[18.8,22],[18.9,21],[19.0,20],[19.1,19],[19.2,18],[19.3,17],[19.4,16],[19.5,15],[19.6,14],[19.7,13],[19.8,12],[19.9,11],[20.0,10],[20.1,9],[20.2,8],[20.3,7],[20.4,6],[20.5,5],[20.6,4],[20.7,3],[20.8,2]]],"higher":false},{"id":37,"name":"Контрольное упражнение с мини-футбольным мячом","text":["Упражнение предназначено для курсантов образовательных организаций.","Выполняется в спортивной форме одежды на мини-футбольной площадке (ширина 20 м, длинна 40 м) с мини-футбольным мячом.","По команде \"НА СТАРТ\" выйти на исходное положение на пересечении боковой и средней линий. По команде \"ВНИМАНИЕ\" принять неподвижное положение старта. По звуковому сигналу или команде \"МАРШ\" выполнить движение в сторону ворот до 6-метровой отметки, где установлен мяч. Добежав, начать ведение мяча ногами любым способом в сторону других ворот. Обведя 5 стоек, стоящих на расстоянии 1,5 м одна от другой (первая стойка находится на 10-метровой отметке от ближайших ворот), продолжить ведение и произвести удар мяча по воротам после пересечения средней линии площадки с любого расстояния. Выполнение упражнения заканчивается после попадания мяча в створ ворот.","Если пропущено или выполнено неправильно какое-либо действие, упражнение считается невыполненным"],"group":"Ловкость","special":false,"kind":"seconds","unit":"секунды","variant":"none","points":[[[10.5,100],[10.6,99],[10.7,98],[10.8,97],[10.9,96],[11.0,95],[11.1,94],[11.2,93],[11.3,92],[11.4,91],[11.5,90],[11.6,89],[11.7,88],[11.8,87],[11.9,86],[12.0,85],[12.1,84],[12.2,83],[12.3,82],[12.4,81],[12.5,80],[12.6,79],[12.7,78],[12.8,77],[12.9,76],[13.0,75],[13.1,74],[13.2,73],[13.3,72],[13.4,71],[13.5,70],[13.6,69],[13.7,68],[13.8,67],[13.9,66],[14.0,65],[14.1,64],[14.2,63],[14.3,62],[14.4,61],[14.5,60],[14.6,59],[14.7,58],[14.8,57],[14.9,56],[15.0,55],[15.1,54],[15.2,53],[15.3,52],[15.4,51],[15.5,50],[15.6,49],[15.7,48],[15.8,47],[15.9,46],[16.0,45],[16.1,44],[16.2,43],[16.3,42],[16.4,41],[16.5,40],[16.6,39],[16.7,38],[16.8,37],[16.9,36],[17.0,35],[17.1,34],[17.2,33],[17.3,32],[17.4,31],[17.5,30],[17.6,29],[17.7,28],[17.8,27],[17.9,26],[18.0,25],[18.1,24],[18.2,23],[18.3,22],[18.4,21],[18.5,20],[18.6,19],[18.7,18],[18.8,17],[18.9,16],[19.0,15],[19.1,14],[19.2,13],[19.3,12],[19.4,11],[19.5,10],[19.6,9],[19.7,8],[19.8,7],[19.9,6],[20.0,5],[20.1,4],[20.2,3],[20.3,2]]],"higher":false},{"id":38,"name":"Контрольное упражнение с волейбольным мячом","text":["Упражнение предназначено для курсантов образовательных организаций.","Выполняется в спортивной форме одежды на волейбольной площадке (ширина 9 м, длина 18 м) с волейбольным мячом. Высота волейбольной сетки для мужчин - 2 м 43 см, для женщин - 2 м 24 см.","По команде \"НА СТАРТ\" выйти на исходное положение за линией подачи с мячом в руках. По звуковому сигналу или команде \"МАРШ\" выполнить верхнюю прямую подачу на противоположную сторону площадки. После выполнения подачи добежать до зоны N 2, взять мяч, который лежит на пересечении средней и боковой линий площадки, в прыжке двумя руками перебросить его на противоположную сторону площадки не дальше линии атаки. Переместиться вдоль сетки приставными шагами, выполнить второй бросок мяча в прыжке двумя руками в зоне N 3 (посередине площадки), продолжить движение приставным шагом до зоны N 4, взять мяч, который лежит на пересечении средней и боковой линий площадки, выполнить третий бросок. Повернувшись кругом, добежать до мяча, лежащего на середине линии атаки, и взяв его в руки, выполнить нападающий удар с собственного набрасывания над сеткой на противоположную сторону площадки. Выполнение упражнения заканчивается после касания мяча площадки.","Если пропущено или не выполнено какое-либо действие, упражнение считается невыполненным."],"group":"Ловкость","special":false,"kind":"seconds","unit":"секунды","variant":"none","points":[[[12.2,100],[12.3,99],[12.4,98],[12.5,97],[12.6,96],[12.7,95],[12.8,94],[12.9,93],[13.0,92],[13.1,91],[13.2,90],[13.3,89],[13.4,88],[13.5,87],[13.6,86],[13.7,85],[13.8,84],[13.9,83],[14.0,82],[14.1,81],[14.2,80],[14.3,79],[14.4,78],[14.5,77],[14.6,76],[14.7,75],[14.8,74],[14.9,73],[15.0,72],[15.1,71],[15.2,70],[15.3,69],[15.4,68],[15.5,67],[15.6,66],[15.7,65],[15.8,64],[15.9,63],[16.0,62],[16.1,61],[16.2,60],[16.3,59],[16.4,58],[16.5,57],[16.6,56],[16.7,55],[16.8,54],[16.9,53],[17.0,52],[17.1,51],[17.2,50],[17.3,49],[17.4,48],[17.5,47],[17.6,46],[17.7,45],[17.8,44],[17.9,43],[18.0,42],[18.1,41],[18.2,40],[18.3,39],[18.4,38],[18.5,37],[18.6,36],[18.7,35],[18.8,34],[18.9,33],[19.0,32],[19.1,31],[19.2,30],[19.3,29],[19.4,28],[19.5,27],[19.6,26],[19.7,25],[19.8,24],[19.9,23],[20.0,22],[21.1,21],[21.2,20],[21.3,19],[21.4,18],[21.5,17],[21.6,16],[21.7,15],[21.8,14],[21.9,13],[22.0,12],[22.1,11],[22.2,10],[22.3,9],[22.4,8],[22.5,7],[22.6,6],[22.7,5],[22.8,4],[22.9,3],[23.0,2]]],"higher":false},{"id":39,"name":"Бег на 60 м с грузом","text":["Упражнение выполняется в военной форме одежды, бронежилете, защитном шлеме с автоматом (массогабаритным макетом автомата) с пристегнутым магазином, с ящиком для боеприпасов весом 30 кг (далее - груз), на ровной дистанции.","Положение автомата и груза произвольное.","По команде \"НА СТАРТ\" подойти к стартовой линии, поста 199,85],[200,84],[201,83],[202,82],[203,81],[204,80],[205,79],[206,78],[207,77],[208,76],[209,75],[210,74],[211,73],[212,72],[213,71],[214,70],[215,69],[216,68],[217,67],[218,66],[219,65],[220,64],[221,63],[222,62],[223,61],[224,60],[225,59],[226,58],[227,57],[228,56],[229,55],[230,54],[231,53],[232,52],[233,51],[234,50],[235,49],[236,48],[237,47],[238,46],[239,45],[240,44],[241,43],[242,42],[243,41],[244,40],[245,39],[246,38],[247,37],[248,36],[249,35],[250,34],[251,33],[252,32],[253,31],[254,30],[255,29],[256,28],[257,27],[258,26],[259,25],[260,24],[261,23],[262,22],[263,21],[264,20],[265,19],[266,18],[267,17],[268,16],[269,15],[270,14],[271,13],[272,12],[273,11],[274,10],[275,9],[276,8]]],"higher":false},{"id":53,"name":"Комплекс приемов и действий рукопашного боя","text":["Баллы определяются по итоговой оценке, выставленной проверяющим: «5» — 100, «4» — 70, «3» — 40, «2» — 0. Самостоятельное присвоение оценки за отдельные приёмы не заменяет оценку комиссии."],"group":"Рукопашный бой","special":true,"kind":"choice","unit":"Оценка проверяющего","variant":"none","higher":true,"points":[[[5,100],[4,70],[3,40],[2,0]]],"choices":["Не выполнено","2 — неудовлетворительно","3 — удовлетворительно","4 — хорошо","5 — отлично"]},{"id":54,"name":"Метание ножа на точность с места","text":["Упражнение выполняется в военной форме одежды в штатном бронежилете и каске. Для метания используются штатные ножи \"Ратник\" 6x9-1, либо другие ножи, соответствующие следующим требованиям:","общая длина - не более 300 мм;","длина клинка - не более 160 мм;","толщина обуха - не боле 8 мм;","вес - не более 300 г.","Метание ножей на точность производится по мишени N 8 (ростовая фигура, рис. 86 ) с обозначенной зоной поражения 20 x 30 см слева от оси мишени, дистанция метания не менее трех метров. Военнослужащему разрешается выбор оптимальной дистанции, а также способа метания (хватом за клинок или рукоятку).","По команде руководителя военнослужащий производит метание трех ножей по обозначенной зоне поражения.","Засчитываются только оставшиеся в мишени ножи, в случае попадания в мишень с дальнейшим падением ножа бросок не засчитывается."],"group":"Рукопашный бой","special":true,"kind":"choice","unit":"Зачтённый результат","variant":"none","points":[[[3,100],[2,70],[1,40]]],"higher":true,"choices":["Не выполнено","1 попаданий","2 попаданий","3 попаданий"]},{"id":55,"name":"Метание малой пехотной лопаты на точность с места","text":["Упражнение выполняется в военной форме одежды в штатном бронежилете и защитном шлеме. Для метания используются штатные малые пехотные лопаты с фиксированным штыком.","(в ред. Приказа Министра обороны РФ от 14.03.2025 N 146)","Метание малых пехотных лопат на точность производится по мишени N 8 (ростовая фигура, рис. 86 ) с обозначенной зоной поражения выше пояса (на расстоянии 700 мм от основания мишени), дистанция метания не менее 5 метров. Метание производится хватом за рукоятку. Военнослужащему разрешается выбор оптимальной дистанции.","По команде руководителя военнослужащий производит метание трех малых пехотных лопат по обозначенной зоне поражения.","Засчитываются только оставшиеся в мишени малые пехотные лопаты, в случае попадания в мишень с дальнейшим падением малой пехотной лопаты бросок не засчитывается.","ножа и малой пехотной лопаты на точность с места"],"group":"Рукопашный бой","special":true,"kind":"choice","unit":"Зачтённый результат","variant":"none","points":[[[3,100],[2,70],[1,40]]],"higher":true,"choices":["Не выполнено","1 попаданий","2 попаданий","3 попаданий"]},{"id":56,"name":"Плавание в обмундировании с оружием на 50 м","text":["Форма одежды N 2В в ботинках, автомат (массогабаритный макет) за спиной.","(в ред. Приказа Министра обороны РФ от 14.03.2025 N 146)","Исходные положения - стоя на стартовой тумбе или рядом с ней, либо в воде у бортика плавательного бассейна. По команде \"ЗАНЯТЬ МЕСТА\" занимается положение на стартовой тумбе или рядом с ней, либо в воде у бортика плавательного бассейна. По команде \"НА СТАРТ\" принять неподвижное положение старта. Старт выполняется по звуковому сигналу или команде \"МАРШ\".","Старт выполняется со стартовой тумбы, бортика бассейна (водной станции). При плавании применяется любой способ. Поворот и финиш выполняются с обязательным касанием поворотного щита бассейна (водной станции) любой частью тела.","Старт раньше команды \"МАРШ\", касание дна плавательного бассейна (водной станции), захват за разграничительные дорожки не допускается.","Упражнение считается невыполненным при утере оружия или предметов обмундирования."],"group":"Военно-прикладное плавание","special":true,"kind":"time","unit":"мин:с","variant":"none","points":[[[75,100],[76,97],[77,94],[78,91],[79,88],[80,85],[81,82],[82,79],[83,76],[84,73],[85,70],[86,67],[87,64],[88,61],[89,58],[90,55],[91,52],[92,49],[93,46],[94,43],[95,40],[96,37],[97,34],[98,31],[99,28],[100,25],[101,22],[102,19],[103,16],[104,13],[105,10]]],"higher":false},{"id":57,"name":"Плавание в обмундировании с оружием на 100 м","text":["Форма одежды N 2В (ботинки сняты и заправлены за поясной ремень, автомат (массогабаритный макет) с пристегнутым магазином за спиной, головной убор закреплен произвольно).","(в ред. Приказа Министра обороны РФ от 14.03.2025 N 146)","Исходные положения - стоя на стартовой тумбе или рядом с ней, либо в воде у бортика плавательного бассейна (водной станции). По команде \"ЗАНЯТЬ МЕСТА\" занимается положение на стартовой тумбе или рядом с ней, либо в воде у бортика плавательного бассейна (водной станции). По команде \"НА СТАРТ\" принять неподвижное положение старта. Старт выполняется по звуковому сигналу или команде \"МАРШ\".","При плавании применяется любой способ. Поворот и финиш выполняются с обязательным касанием поворотного щита бассейна (водной станции) любой частью тела.","Старт раньше команды \"МАРШ\", касание дна плавательного бассейна (водной станции), захват за разграничительные дорожки не допускается.","Упражнение считается не выполненным при утере оружия или пред .0,16],[13.0,13],[12.0,8]]],"higher":true},{"id":59,"name":"Бег на 3 км со стрельбой и метанием гранат","text":["Старт и финиш оборудуются, как правило, в одном месте. Упражнение выполняется в военной форме одежды, с автоматом и пристегнутым магазином, сумкой для магазинов с одним магазином, противогазом. Дополнительное крепление оружия и снаряжения не допускается. Упражнение проводится с раздельным стартом военнослужащих и выполняется в следующей последовательности: стрельба; метание гранат.","Стрельба организуется в соответствии с требованиями курса стрельб из стрелкового оружия и боевых машин. Стрельба ведется из положения лежа тремя одиночными выстрелами по грудной фигуре (мишень N 6), установленной на удалении 100 м. Военнослужащий на огневом рубеже обеспечивается патронами в виде снаряженного тремя патронами магазина, занимает свободный огневой рубеж и ведет стрельбу по готовности до первого попадания в мишень. После окончания стрельбы военнослужащий производит разряжание оружия, пристегивает пустой магазин и продолжает бег.","Место для метания гранат оборудуется коридорами шириной по 10 м и длиной 40 м. Военнослужащий обеспечивается гранатами на исходном рубеже свободного коридора для метания гранат в виде трех массогабаритных макетов весом 600 - 620 г и ведет метание до первого попадания за рубеж 30 м после чего продолжает бег.","(в ред. Приказа Министра обороны РФ от 14.03.2025 N 146)","За промах в стрельбе или бросок гранаты менее чем на 30 м участник штрафуется соответственно на 20 и 10 с."],"group":"Специальные приёмы и действия","special":true,"kind":"time","unit":"мин:с","variant":"none","points":[[[840,100],[842,99],[844,98],[846,97],[848,96],[850,95],[852,94],[854,93],[856,92],[858,91],[860,90],[862,89],[864,88],[866,87],[868,86],[870,85],[872,84],[874,83],[876,82],[878,81],[880,80],[882,79],[884,78],[886,77],[888,76],[890,75],[892,74],[894,73],[896,72],[898,71],[900,70],[902,69],[904,68],[906,67],[908,66],[910,65],[912,64],[914,63],[916,62],[918,61],[920,60],[922,59],[924,58],[926,57],[928,56],[930,55],[932,54],[934,53],[936,52],[938,51],[940,50],[942,49],[944,48],[946,47],[948,46],[950,45],[952,44],[954,43],[956,42],[958,41],[960,40],[962,39],[964,38],[966,37],[968,36],[970,35],[972,34],[974,33],[976,32],[978,31],[980,30],[982,29],[984,28],[986,27],[988,26],[990,25],[992,24],[994,23],[996,22],[998,21],[1000,20],[1002,19],[1004,18],[1006,17],[1008,16],[1010,15],[1012,14],[1014,13],[1016,12],[1018,11],[1020,10]]],"higher":false},{"id":60,"name":"Бег с преодолением полосы препятствий","text":["Упражнение выполняется в военной форме одежды с автоматом и пристегнутым магазином, сумкой для магазинов с одним магазином, противогазом. Старт - раздельный. Дистанция - 1100 м.","Пробежать 1000 м. Преодолеть полосу препятствий: преодолеть ров; пробежать по проходам лабиринта; перелезть через забор; преодолеть разрушенную лестницу, наступая на три ступени; соскочить на землю, под четвертой ступенью пробежать; преодолеть стенку; перепрыгнуть через траншею."],"group":"Специальные приёмы и действия","special":true,"kind":"time","unit":"мин:с","variant":"none","points":[[[290,100],[291,99],[292,98],[293,97],[294,96],[295,95],[296,94],[297,93],[298,92],[299,91],[300,90],[301,89],[302,88],[303,87],[304,86],[305,85],[306,84],[307,83],[308,82],[309,81],[310,80],[311,79],[312,78],[313,77],[314,76],[315,75],[316,74],[317,73],[318,72],[319,71],[320,70],[321,69],[322,68],[323,67],[324,66],[325,65],[326,64],[327,63],[328,62],[329,61],[330,60],[331,59],[332,58],[333,57],[334,56],[335,55],[336,54],[337,53],[338,52],[339,51],[340,50],[341,49],[342,48],[343,47],[344,46],[345,45],[346,44],[347,43],[348,42],[349,41],[350,40],[351,39],[352,38],[353,37],[354,36],[355,35],[356,34],[357,33],[358,32],[359,31],[360,30],[361,29],[362,28],[363,27],[364,26],[365,25],[366,24],[367,23],[368,22],[369,21],[370,20],[371,19],[372,18],[373,17],[374,16],[375,15],[376,14],[377,13],[378,12],[379,11],[380,10],[381,9],[382,8]]],"higher":false},{"id":61,"name":"Комплексное упражнение \"Квадрат\"","text":["Упражнение выполняется в военной форме одежды, в штатном защитном снаряжении (бронежилет, защитный шлем, наколенники, налокотники, перчатки), автомат с магазином, подсумок для магазинов (с одним магазином), сумка для гранат с массогабаритным макетом ручной гранаты весом 300 - 320 грамм. Для размещения боекомплекта (магазин и макет ручной гранаты) может использоваться штатный разгрузочный жилет.","Дистанция 165 м. Исходное положение - изготовка для стрельбы лежа на площадке начала упражнения, оружие направлено в сторону квадрата-3; по команде руководителя - \"ВПЕРЕД\": пробежать короткими перебежками по кривой дорожке (40 м), имеющей четыре зигзага, пробегая их (зигзаги обозначаются красными флажками), до площадки (квадрат-3), взять военнослужащего весом не менее 70 кг (в положении стоя) и перенести его на 25 м до следующей площадки (квадрат-4), далее пробежать по узкой опоре (бревно длиной 5 м, шириной 0,2 на 0,25 м, высота 1 м); переползти под колючей проволокой (длина препятствия 10 м, ширина - 1,5 м, высота - 0,5 м), оббежать флажок в квадрате-1 и прыжком перепрыгнуть ров шириной 2 м, пробежать, наступая по 5 (пяти) препятствиям \"брод-пеньки\" (расстояние между центрами \"брод-пеньков\" - 1,30 - 1,35 м, диаметр \"брод-пеньков - 0,15 - 0,20 м, высота не более 0,10 м), границы препятствия обозначены линиями на расстоянии 1,35 м от \"брод-пеньков\" (наступать на линии при преодолении препятствия запрещено); на площадке (квадрат-2) взять двумя руками ящик весом 20 кг (автомат перевести в положении на ремень или за спину) и пробежать с ним до площадки (квадрат-3), положить ящик, достать из подсумка и выполнить метание массогабаритного макета ручной гранаты весом 300 - 320 грамм из положения стоя по мишени (мишень круг радиусом 5 м, расстояние от линии метания до центра круга 35 м) после метания принять положение упора лежа и выполнить сгибание рук касаясь грудью земли, вскочить добежать до разрушенной стенки высотой 1 м, прыжком преодолеть препятствие сверху, добегая до площадки (квадрат-4), выполнить кувырок вперед или через левое (правое) плечо, изготовиться для стрельбы с колена, снять автомат с предохранителя и выполнить прицельный холостой спуск курка в направлении мишени N 4, поставить автомат на предохранитель - \"ФИНИШ\".","Преодоление препятствий, метание макетов гранат, специальные приемы и действия разрешается выполнять любым способом, если техника выполнения не обусловлена в описании упражнения. Если пропущено какое-то действие, прием выполнен с нарушением условий или граната при метании не попала в мишень (круг), то упражнение считается невыполненным.","(в ред. Приказа Министра обороны РФ от 14.03.2025 N 146)","В случае потери предметов обмундирования военнослужащий обязан вернуться, поднять утерянное и продолжить выполнение упражнения.","За непопадание гранатой в сектор, выполнение упражнения продолжается, к результату прибавляется 2 секунды."],"group":"Специальные приёмы и действия","special":true,"kind":"time","unit":"мин:с","variant":"none","points":[[[75,100],[76,95],[77,90],[78,85],[79,80],[80,75],[81,70],[82,65],[83,60],[84,55],[85,50],[86,45],[87,40],[88,36],[89,32],[90,28],[91,24],[92,20],[93,16],[94,12],[95,8]]],"higher":false},{"id":62,"name":"Упражнение на стационарном гимнастическом колесе","text":["Выполнить 10 оборотов влево и 10 оборотов вправо. Начинается и заканчивается упражнение в момент прохождения вертикали головой вверх.","Переход движений оборотов в другую сторону не более 30 с.","Разрешается начинать упражнение в любую сторону.","Оценка производится по общему времени, затраченному на 20 оборотов, без остановки времени после выполнения первых 10 оборотов.","Выполнение упражнения без крепления ремнями рук и ног к колесу не допускается.","Упражнение выполняется в военной (спортивной) форме одежды по команде: \"К выполнению упражнения - ПРИСТУПИТЬ\"."],"group":"Специальные приёмы и действия","special":true,"kind":"seconds","unit":"секунды","variant":"  <section class="card"><h2>Основные данные</h2><div class="grid"><div><label for="sex">Пол</label><select id="sex">${options([['m','Мужской'],['f','Женский']],p.sex)}</select></div><div><label for="age">Возраст на дату сдачи</label><input id="age" type="number" min="16" max="100" step="1" required value="${p.age}"></div></div><div class="field"><label for="weight">Масса тела, кг</label><input id="weight" type="number" min="30" max="250" step="0.1" required value="${p.weight}"><div class="small">Для гирь и штанги. Весовая категория определяется автоматически.</div></div></section>

 <section class="card"><h2>Условия сдачи</h2><label for="health">Комплекс упражнений</label><select id="health">${options([['standard','Стандартный КПК'],['individual','Индивидуальный КПК по п. 107']],p.health)}</select><p class="small">Для IIIа / IIIб группы здоровья или инвалидности — при допуске и согласовании с врачом. Категория службы не является группой здоровья.</p><label for="condition">Поправка к результату</label><select id="condition">${options(conditionOptions,p.condition)}</select><p class="small">Приложение № 11 допускает одну поправку. Северная и высотная поправки не суммируются.</p></section>
 <section class="card profile-standards" id="profile-standards" aria-live="polite">${standardHtml(p)}</section>
 <div id="profile-error" class="error" role="alert"></div><button class="primary wide" type="submit">Сохранить профиль</button><p class="version">Без регистрации · Данные хранятся локально</p></form>`;
 const refresh=()=>{
  const p=profileFromForm(),f=p.sex==='f',individual=p.health==='individual';
  $('#category-field').hidden=f||p.service!=='contract'||individual;
  $('#course-field').hidden=p.service!=='cadet'||individual;$('#count-field').hidden=p.service!=='conscript'||individual;
  $('#profile-standards').innerHTML=standardHtml(p);
 };
 $('#profile-form').addEventListener('input',refresh);$('#profile-form').addEventListener('change',refresh);refresh();
 $('#category-help').onclick=()=>openModal(categoryHelp());
 $('#profile-form').onsubmit=e=>{
  e.preventDefault();const p=profileFromForm(),error=NFP.profileError(p);
  if(error){$('#profile-error').textContent=error;return;}
  if(write('profile',p)){profile=p;saved=true;toast('Профиль сохранён');navigate('calc');}
 };
}
function historyRowsHtml(h){
 return `<ul class="history-exercises">${h.rows.map((row,i)=>{const e=data.find(x=>x.id===+row.id);return `<li><span>№ ${e.id} · ${esc(e.name)}<small>${esc(resultLabel(e,row))}${h.result.scores[i].correction?'<br>'+esc(scoreExplanation(e,h.result.scores[i],h.profile)):''}</small></span><b>${h.result.scores[i].points}<small>баллов</small></b></li>`;}).join('')}</ul>`;
}
function renderHistory(){
 const sorted=[...history].sort((a,b)=>b.date.localeCompare(a.date)||(b.savedAt||'').localeCompare(a.savedAt||''));
 $('#main').innerHTML=`<div class="eyebrow">ЛИЧНЫЙ ЖУРНАЛ</div><h1>История ФИЗО</h1><p class="sub">Дата сдачи, упражнения и достигнутый уровень. Сначала — последние сдачи.</p>${sorted.length?sorted.map(h=>`<article class="card history-card"><div class="eyebrow">ДАТА СДАЧИ ФИЗО</div><div class="spread"><div><h2 class="history-date">${esc(h.date.split('-').reverse().join('.'))}</h2><h3>${esc(h.title)}</h3></div><div class="history-number">${h.result.total}<div class="small">баллов</div></div></div><p class="history-level">${h.result.qualification?qualificationText(h.result):gradeName(h.result.grade)}</p><div class="small">Оценка ${h.result.grade} — ${gradeName(h.result.grade).toLowerCase()}<br>${esc(standardContext(h.profile))}</div>${historyRowsHtml(h)}<div class="history-actions"><button class="text-button" data-history="${h.id}">Подробности ↗</button><button class="text-button" data-copy="${h.id}">Повторить</button><button class="text-button" data-delete="${h.id}">Удалить</button></div></article>`).join(''):'<div class="card empty"><div class="empty-icon">◷</div><h3>Здесь будут ваши сдачи ФИЗО</h3><p class="sub">После расчёта нажмите «Сохранить сдачу ФИЗО» и укажите дату. Все результаты упражнений останутся в истории.</p><button class="primary" id="to-calc">Рассчитать результат</button></div>'}<p class="version">История хранится в этом браузере. Очистка данных сайта удалит её. Не используйте приватный просмотр для сохранения результатов.</p>`;
 if($('#to-calc'))$('#to-calc').onclick=()=>navigate('calc');
 document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>showHistory(history.find(h=>h.id===b.dataset.history)));
 document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmAction('Удалить запись о сдаче ФИЗО?','Запись будет удалена из истории на этом устройстве.',()=>{const next=history.filter(h=>h.id!==b.dataset.delete);if(write('history',next)){history=next;renderHistory();}}));
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>confirmAction('Повторить набор упражнений?','Текущий черновик будет заменён. Применится ваш текущий профиль, результаты нужно ввести заново.',()=>{rows=history.find(h=>h.id===b.dataset.copy).rows.map(r=>({id:r.id,value:''}));write('draft',rows);navigate('calc');}));
}
function showHistory(h){
 openModal(`<div class="eyebrow">ДАТА СДАЧИ ФИЗО</div><h2>${esc(h.date.split('-').reverse().join('.'))}</h2><h3>${esc(h.title)}</h3><p class="history-level">${h.result.qualification?qualificationText(h.result):gradeName(h.result.grade)}</p><h1>${h.result.total} <span class="small">баллов</span></h1><p>Оценка ${h.result.grade} — ${gradeName(h.result.grade).toLowerCase()}<br>${esc(profileLine(h.profile))}<br>${esc(serviceName(h.profile))}</p><div class="notice">${esc(standardContext(h.profile))}<br>Условия: ${{normal:'обычные',north:'Крайний Север',altitude:'выше 1500 м'}[h.profile.condition]}<br>НФП: редакция ${h.revision}, действует с 02.02.2026</div>${historyRowsHtml(h)}<button class="primary wide" id="share-result">Поделиться результатами</button>`);
 $('#share-result').onclick=()=>{
  const text=`НФП 2026 — ${h.title}\nДата сдачи ФИЗО: ${h.date}\n${h.result.qualification?qualificationText(h.result):gradeName(h.result.grade)}\n${h.result.total} баллов. Оценка ${h.result.grade} — ${gradeName(h.result.grade)}.\n${profileLine(h.profile)}\n${serviceName(h.profile)}\n${h.rows.map((r,i)=>{const e=data.find(e=>e.id===+r.id);return `№ ${r.id}: ${e.name} — ${resultLabel(e,r)}, ${h.result.scores[i].points} баллов${h.result.scores[i].correction?' · '+scoreExplanation(e,h.result.scores[i],h.profile):''}`;}).join('\n')}\nНФП, редакция ${h.revision}, действует с 02.02.2026. Справочный расчёт.`;
  if(window.NfpIOS)NfpIOS.share(text);
  else if(navigator.share)navigator.share({text}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Текст скопирован')).catch(()=>toast('Копирование недоступно'));
 };
}
</script><script>'use strict';
const $=s=>document.querySelector(s), data=NFP_DATA, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={sex:'m',age:25,weight:75,service:'contract',category:3,course:1,conscriptCount:3,condition:'normal',health:'standard'};
function read(key,fallback){try{return JSON.parse(localStorage.getItem('nfp.web.'+key))??fallback}catch{return fallback}}
let profile={...defaults,...read('profile',{})},saved=read('profile',null)!==null,rows=read('draft',[]),history=read('history',[]),tab='calc';
if(!Array.isArray(rows))rows=[];rows=rows.filter(r=>data.some(e=>e.id===+r.id)).slice(0,5);
if(!Array.isArray(history))history=[];
if(rows.some(r=>r.failed)){rows=rows.map(r=>r.failed?{...r,value:data.find(e=>e.id===+r.id).kind==='time'?'0:00':'0',failed:false}:r);write('draft',rows);}
function write(key,value){try{localStorage.setItem('nfp.web.'+key,JSON.stringify(value));return true}catch{toast('Не удалось сохранить: проверьте свободное место.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),3000)}
const serviceName=p=>p.service==='cadet'?'Курсант, '+p.course+' курс':p.service==='conscript'?'Служба по призыву':'Служба по контракту';
const profileLine=p=>`${p.sex==='f'?'Женщина':'Мужчина'} · ${p.age} лет · ${NFP.standard(p).group}-я возрастная группа`;
const gradeName=g=>({5:'Отлично',4:'Хорошо',3:'Удовлетворительно',2:'Неудовлетворительно'}[g]||'Расчёт не завершён');
function fmt(e,v){if(e.kind==='time'){const sec=Number((v%60).toFixed(2));return Math.floor(v/60)+':'+(sec<10?'0':'')+sec;}return String(v).replace('.',',')}
function options(list,value){return list.map(([v,t])=>`<option value="${v}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`).join('')}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({calc:renderCalc,profile:renderProfile,history:renderHistory,guide:renderGuide})[tab]();}
function navigate(t){tab=t;render();window.scrollTo(0,0)}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)navigate(b.dataset.tab)});
// Android resizes the WebView for the keyboard, but its automatic scrolling
// does not account for our fixed bottom navigation.
let focusScrollTimer;
function keepEditingVisible(){
 clearTimeout(focusScrollTimer);
 focusScrollTimer=setTimeout(()=>{
  const el=document.activeElement;
  if(el&&el.matches('input,textarea'))el.scrollIntoView({block:'center',behavior:'instant'});
 },180);
}
window.addEventListener('resize',keepEditingVisible);
document.addEventListener('focusin',keepEditingVisible);
function categoryHelp(){return `<h2>Категории военнослужащих</h2><p class="sub">Пункт 87 НФП. Категория зависит от места службы и должности, а не от здоровья.</p><details open><summary>Категория № 1</summary><p>Основные подразделения и подразделения обеспечения воинских частей, кроме перечисленных в категориях № 2 и № 3.</p></details><details><summary>Категория № 2</summary><p>Топогеодезические, медицинские подразделения, военные комендатуры, метеорологические (гидрометеорологические), материально-технического, аэродромно-технического, десантного обеспечения, испытательные центры (полигоны), переменный состав учебных воинских частей, отряд быстрого реагирования Управления коменданта охраны МО РФ.</p></details><details><summary>Категория № 3</summary><p>Органы военного управления, военная полиция, управления соединений, частей и батальонов; научные организации, военные учебные центры, военные представительства, главные центры, центры, арсеналы, базы и отделы видов обеспечения; центры управления, лаборатории специального контроля; образовательные организации (кроме курсантов), постоянный состав учебных частей; пункты отбора, военкоматы, медицинские организации, военные оркестры и ансамбли, фельдъегерская почтовая служба.</p><p>Подразделения, не входящие в категории № 1 и № 2, относятся к категории № 3.</p></details><div class="notice">Медицинское подразделение и медицинская организация — разные случаи. Уточняйте категорию по занимаемой должности в своей части.</div>`}
function renderGuide(){ $('#main').innerHTML=`<div class="eyebrow">РАЗОБРАТЬСЯ В НФП</div><h1>Справочник</h1><p class="sub">Нормативы, термины и правила оценки — отдельно от расчёта.</p><button class="catalog-button" id="all-exercises"><span class="icon-circle">▤</span><div><strong>70 упражнений</strong><small>Условия выполнения и таблицы баллов</small></div><span style="margin-left:auto">↗</span></button><h2 class="section-title">Как это работает</h2><details><summary>Как считается итоговая оценка</summary><p>Результат каждого упражнения переводится в баллы по приложению № 5. Затем проверяются минимумы каждого упражнения и сумма по приложению № 6.</p><p>Не выполнено хотя бы одно упражнение, не набран его минимум или недостаточна сумма на «3» — итог «неудовлетворительно» (п. 83).</p><p>Между табличными значениями приложение засчитывает наибольший порог, который фактически достигнут, без интерполяции и округления результата в лучшую сторону. Максимум — 100 баллов за упражнение.</p></details><details><summary>Оценка и квалификационный уровень</summary><p>«3», «4», «5» — оценка подготовленности по сумме. Высший, первый, второй и третий — квалификационные уровни с собственными порогами. Для призывников они в приложении № 6 не предусмотрены.</p><p>Оценка отдельного упражнения по приложению № 12 и минимальный порог для общего зачёта по приложению № 6 — разные показатели.</p></details><details><summary>КПК, ОФУ, СФУ — расшифровка</summary><p><b>НФП</b> — Наставление по физической подготовке. <b>КПК</b> — контрольно-проверочный комплекс. <b>ОФУ</b> — общие физические упражнения (№ 1–38). <b>СФУ</b> — специальные физические упражнения (№ 39–70).</p><p>Состав КПК определяет специалист физической подготовки. Военнослужащие, кроме курсантов, выбирают ОФУ из назначенного КПК. Выбор СФУ не предоставляется (п. 90).</p><p>Приложение проверяет количество и общую структуру комплекса. Соответствие конкретных упражнений утверждённому в части КПК проверяйте по документам части.</p></details><button id="categories" class="catalog-button"><strong>Категории № 1, № 2, № 3</strong><span style="margin-left:auto">↗</span></button><details><summary>Возрастные и весовые группы</summary><p>Возраст: до 25, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, от 60 лет. У женщин последняя группа — от 50 лет.</p><p>Часть таблиц различает возраст до 35 лет и от 35 лет. Для гирь и штанги: мужчины до 70 кг включительно, свыше 70 до 80 кг включительно, свыше 80 кг; женщины до 60, свыше 60 до 70, свыше 70 кг.</p><p>Укажите возраст на дату проверки. Приложение не меняет его автоматически.</p></details><details><summary>Как вводить время и штрафы</summary><p>Время вводится в два поля: <b>минуты</b> и <b>секунды</b>. Секунды изначально 00: введите 3 в минуты, чтобы получить 3:00. Двоеточие вводить не нужно. Пустой результат — черновик; нулевой результат — 0 баллов. Для упражнений, измеряемых только в секундах: <b>14,2</b> или <b>14.2</b>. Для количества повторений вводите целое число.</p><p>Введите зачтённый проверяющим результат с уже учтёнными штрафами. Климатическую или высотную поправку приложение применяет отдельно по настройке профиля. Не применяйте её дважды.</p></details><details><summary>Северные и высотные поправки</summary><p>Поправки по приложению № 11 применяются только к перечисленным там упражнениям. Применяется одна поправка: для Крайнего Севера и приравненных районов либо для высоты более 1500 м. Для остальных упражнений результат не меняется. Это прибавка или вычитание из результата, а не коэффициент умножения баллов. Например, 800 м с оружием: 3:00 − 5 с = 2:55 для Крайнего Севера; на высоте более 1500 м вычитается 7 с. Условия можно выбрать на экране расчёта.</p></details><details><summary>Индивидуальный КПК и здоровье</summary><p>Для IIIа/IIIб группы здоровья или инвалидности по п. 107 требуются допуск врача и индивидуальный КПК. Оценка рассчитывается по категории № 3 с учётом возраста и пола.</p><p>Для II группы здоровья замены определяются по п. 106 с учётом рекомендаций медицинского работника и специалиста физподготовки. Приложение не определяет медицинский допуск.</p></details><h2 class="section-title">Таблицы НФП · офлайн</h2>${[[6,'Общие оценки и квалификационные уровни'],[8,'Образцы КПК'],[11,'Поправки к результатам'],[12,'Оценка одного упражнения'],[13,'Требования для поступающих на контракт'],[14,'Перевод баллов для поступающих']].map(([n,t])=>`<a class="source-link" href="appendix-${n}.html">Приложение № ${n} · ${t} ↗</a>`).join('')}<details><summary>Почему редакция 2025 года, а приложение — 2026?</summary><p>Изменения утверждены приказом № 802 от 08.12.2025, опубликованы 22.01.2026 и действуют с 02.02.2026. Год подписания приказа сохраняется в названии редакции.</p></details><a class="source-link" href="privacy.html">Политика конфиденциальности ↗</a><h2 class="section-title">Документы и источники</h2><p class="small">Встроенные данные: приказ МО РФ № 230 от 20.04.2023 в редакции от 08.12.2025 (действует с 02.02.2026). Проверка источников: 06.10.2026. Источники ниже открываются в браузере.</p><a class="source-link" href="https://publication.pravo.gov.ru/document/0001202601220012">Приказ № 802 — официальная публикация ↗</a><a class="source-link" href="https://meganorm.ru/mega_doc/dop1/82/federalnyy_zakon_ot_04_12_2007_N_329-fz_red_ot_28_11_2025_o/1/prikaz_ministra_oborony_rf_ot_20_04_2023_N_230_red_ot_08_12.html">Полный текст НФП в актуальной редакции ↗</a><details><summary>Об этом приложении и данных</summary><p>Независимый справочный калькулятор, не официальное приложение Минобороны. Не присваивает квалификацию и не оформляет результаты проверки.</p><p>Профиль, черновик и история хранятся только на устройстве. Регистрации нет. После загрузки страницы расчёт выполняется на устройстве. Для повторного открытия страницы нужен интернет. Веб-версия не содержит рекламы и аналитики. Отправка результата происходит только по кнопке «Поделиться» через выбранное вами приложение.</p><p>Герб РФ: Евгений Ухналёв; SVG — Zscout370 / Wikimedia Commons. Масштабирование для значка. <a href="https://commons.wikimedia.org/wiki/File:Coat_of_Arms_of_the_Russian_Federation.svg">Источник</a> · <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC BY-SA 2.0</a> (PD-RU-exempt в РФ).</p><p>Веб-версия для тестирования. Калькулятор предназначен для действующих военнослужащих; требования к поступающим приведены отдельно в справочнике.</p></details><p class="version">НФП 2026 · Веб-версия для тестирования</p>`;$('#all-exercises').onclick=()=>openCatalog(false);$('#categories').onclick=()=>openModal(categoryHelp());}
function openModal(html){$('#modal-content').innerHTML=`<div class="spread modal-top"><span class="eyebrow">НФП 2026</span><button class="text-button" id="close-modal">Закрыть ×</button></div>`+html;if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;$('#close-modal').onclick=closeModal;}
function closeModal(){$('#modal').close()}
function confirmAction(title,text,action){openModal(`<h2>${esc(title)}</h2><p class="sub">${esc(text)}</p><button class="primary wide" id="confirm-action">Подтвердить</button><button class="secondary wide" id="cancel-action">Отмена</button>`);$('#confirm-action').onclick=()=>{closeModal();action()};$('#cancel-action').onclick=closeModal;}
function openCatalog(add){openModal(`<h2>${add?'Добавить упражнение':'Упражнения НФП'}</h2><input id="catalog-search" class="search" type="search" placeholder="Название или номер" aria-label="Поиск упражнения"><div class="chips">${['Все','Сила','Быстрота','Выносливость','Ловкость','СФУ'].map((x,i)=>`<button class="chip ${i?'':'active'}" data-filter="${x}">${x}</button>`).join('')}</div><div id="catalog-list"></div>`);let filter='Все';function list(){const q=$('#catalog-search').value.toLowerCase();const found=data.filter(e=>(filter==='Все'||filter==='СФУ'&&e.special||e.group===filter)&&(e.name.toLowerCase().includes(q)||String(e.id)===q));$('#catalog-list').innerHTML=found.length?found.map(e=>`<button class="catalog-button" data-exercise="${e.id}" ${add&&rows.some(r=>+r.id===e.id)?'disabled':''}><span class="num">${String(e.id).padStart(2,'0')}</span><div><strong>${esc(e.name)}</strong><small>${e.group} · ${e.unit}${add&&rows.some(r=>+r.id===e.id)?' · Добавлено':''}</small></div></button>`).join(''):'<p class="sub">Упражнений не найдено.</p>';document.querySelectorAll('[data-exercise]').forEach(b=>b.onclick=()=>{if(add){rows.push({id:+b.dataset.exercise,value:'',failed:false});write('draft',rows);closeModal();renderCalc()}else openExercise(+b.dataset.exercise)})}$('#catalog-search').oninput=list;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(c=>c.classList.toggle('active',c===b));list()});list()}
function openExercise(id){const e=data.find(x=>x.id===id),v=NFP.variant(e,profile),t=e.points[v],c=NFP.correctionFor(e,profile);openModal(`<div class="eyebrow">УПРАЖНЕНИЕ № ${id} · ${e.group}</div><h2>${esc(e.name)}</h2><details open><summary>Условия выполнения</summary><div class="reference-text">${e.text.map(x=>'<p>'+esc(x)+'</p>').join('')}</div></details><details open><summary>Таблица баллов</summary><p class="small">${e.variant==='age'?(profile.age>=35?'Возраст от 35 лет':'Возраст до 35 лет'):e.variant==='weight'?`Весовая категория: ${profile.sex==='f'?['до 60 кг','до 70 кг','свыше 70 кг'][v]:['до 70 кг','до 80 кг','свыше 80 кг'][v]}`:'Единая таблица'} · По вашему профилю</p><p class="small">${esc(correctionLabel(e,profile))}. Вводите фактический результат, не вычитайте поправку самостоятельно.</p><div class="table-scroll"><table><thead><tr><th>Табличный результат (${e.unit})</th>${c?`<th>Фактически (${e.unit})</th>`:''}<th>Баллы</th></tr></thead><tbody>${t.map(([value,points])=>`<tr><td>${e.kind==='choice'?(id===53?'Оценка '+value:e.choices[value]):fmt(e,value)}</td>${c?`<td>${fmt(e,Math.max(e.kind==='count'?1:0,value-c))}</td>`:''}<td>${points}</td></tr>`).join('')}</tbody></table></div></details><p class="small">Приложение № 5 к НФП, редакция от 08.12.2025. Схемы и рисунки смотрите в полном тексте документа.</p>`)}
window.handleBack=()=>{if($('#modal').open){closeModal();return true}if(tab!=='calc'){navigate('calc');return true}return false};
render();


</script><script>
